name: Release

# On every push to main: if the <Version> in src/Holocene.Cli/Holocene.Cli.csproj has no GitHub Release yet,
# build self-contained executables for every platform and publish release v<Version> (GitHub creates the tag).
# To release, bump <Version> and push. "Run workflow" on the Actions tab does the same check by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' src/Holocene.Cli/Holocene.Cli.csproj)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

  package:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet run -c Release --project tests/Holocene.Tests
      - name: Publish self-contained executable
        run: >
          dotnet publish src/Holocene.Cli -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o out/bin
      - name: Assemble package
        run: |
          name=holocene-${{ needs.version.outputs.version }}-${{ matrix.rid }}
          mkdir -p "pkg/$name/data"
          cp out/bin/* "pkg/$name/"
          cp -r data/parameters.json data/earth data/validation "pkg/$name/data/"
          cp -r viewer docs README.md "pkg/$name/"
          cd pkg
          if [[ "${{ matrix.rid }}" == win-* ]]; then zip -qr "$name.zip" "$name"; else chmod +x "$name/holocene"; tar czf "$name.tar.gz" "$name"; fi
          echo "PKG_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: pkg/${{ env.PKG_NAME }}.*
          if-no-files-found: error

  release:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.version.outputs.version }}"
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Holocene $tag" --notes "Self-contained builds (no .NET install needed). Unpack and run \`holocene\` (Windows: holocene.exe) to open the world viewer; run \`holocene help\` for the simulation commands. macOS: if Gatekeeper blocks the unsigned binary, right-click it and choose Open, or run \`xattr -d com.apple.quarantine holocene\`."
